plugins {
    id 'java'
}

group = 'cw.ucsp.app'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.hadoop:hadoop-common:3.4.1'
    implementation 'org.apache.hadoop:hadoop-mapreduce-client-core:3.4.1'
    implementation 'org.apache.hadoop:hadoop-mapreduce-client-jobclient:3.4.1'
    implementation 'org.apache.hadoop:hadoop-mapreduce-client-common:3.4.1'
}